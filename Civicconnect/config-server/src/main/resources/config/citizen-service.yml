# ─────────────────────────────────────────────────────────────
# citizen-service  |  Port: 8082
# Owns: Citizen, CitizenDocument entities  |  DB: civicconnect_citizen
# ─────────────────────────────────────────────────────────────
server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/civicconnect_citizen?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: dGhpcy1pcy1hLXZlcnktc2VjdXJlLWtleS1mb3ItY2l2aWNjb25uZWN0LWp3dC0yMDI0
  expiration:
    ms: 86400000

# Required for @FeignClient fallback= to activate circuit breaker
feign:
  circuitbreaker:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      identityServiceCB:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      identityServiceRetry:
        max-attempts: 3
        wait-duration: 500ms
