server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: localhost
  client:
    # This IS the server — it does NOT register with itself or fetch the registry
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Don't wait for minimum peers before serving requests (single-node setup)
    wait-time-in-ms-when-sync-empty: 0
    # Disable self-preservation for dev/local (re-enable in prod)
    enable-self-preservation: false
    # Evict unresponsive instances every 5 seconds (dev-friendly)
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
